env:
    PYTHON_VERSION: '3.11'
    MASTER_SCRIPT: 'profiler.py'
    APPLICATION_NAME: 'llm-photo-profiler'
    
on:
    push:
        branches:
            - 'master'
        tags:
            - 'v*.*.*'
defaults:
    run:
        shell: pwsh
jobs:
    package:
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            - name: 'Python'
              uses: actions/setup-python@v7
              with:
                python-version: ${{ env.PYTHON_VERSION }}
            - name: 'Visual C++ Redistributable'
              run: |
                choco install vcredist140 -y
            - name: 'Checkout'
              uses: actions/checkout@v6
              with:
                submodules: false
                path: 'profiler'
            - name: 'PIP'
              run: |
                python -m pip install --upgrade pip
            - name: 'Requirements'
              run: |
                cd profiler
                pip install pyinstaller
                pip install -r requirements.txt
            - name: 'Packaging'
              run: |
                cd profiler
                pyinstaller --onefile --noconsole --name "${{ env.APPLICATION_NAME }}" --distpath "package" "${{ env.MASTER_SCRIPT }}"
                cd ..
            - name: 'Upload artifact'
              uses: actions/upload-artifact@v4
              with:
                name: '${{ env.APPLICATION_NAME }}-win64'
                path: 'profiler/package/${{ env.APPLICATION_NAME }}.exe'
    upload-release:
        needs: package
        if: github.ref_type == 'tag'
        runs-on: ubuntu-latest
        steps:
            - name: 'Download artifact'
              uses: actions/download-artifact@v4
              with:
                name: '${{ env.APPLICATION_NAME }}-win64'
                path: 'package'
            - name: 'Create Release'
              uses: softprops/action-gh-release@v3
              with:
                name: ${{ github.ref_name }}
                tag_name: ${{ github.ref_name }}
                files: 'package/*.exe'
              env:
                GITHUB_TOKEN: ${{ secrets.RELEASE_CREATION }}
